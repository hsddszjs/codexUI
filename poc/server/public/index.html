<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>codexUI Container PoC</title>
  <style>
    body{font-family:ui-monospace,Menlo,Consolas,monospace;margin:24px;max-width:960px}
    h1{margin:0 0 12px}
    button{margin:4px 4px 4px 0;padding:6px 10px;border:1px solid #888;background:#fafafa;cursor:pointer;border-radius:4px}
    button:hover{background:#eee}
    pre{background:#111;color:#eee;padding:12px;border-radius:6px;overflow:auto;max-height:60vh;white-space:pre-wrap;word-break:break-all}
    .row{display:flex;gap:6px;align-items:center;margin:8px 0}
    input{padding:6px;font-family:inherit;border:1px solid #aaa;border-radius:4px}
    input[type=text]{flex:1}
    .muted{color:#888}
  </style>
</head>
<body>
  <h1>codexUI container PoC</h1>
  <div class="row">
    user: <input id="user" value="wangshunfeng">
    <button onclick="listOnline()">/api/users</button>
  </div>
  <div class="row">
    <button onclick="rpc('initialize',{clientInfo:{name:'poc-browser',title:'PoC',version:'0.0.1'}})">initialize</button>
    <button onclick="rpc('config/read',{})">config/read</button>
    <button onclick="rpc('model/list',{})">model/list</button>
    <button onclick="rpc('thread/start',{})">thread/start</button>
    <button onclick="rpc('thread/list',{})">thread/list</button>
  </div>
  <div class="row">
    <input id="msg" type="text" placeholder="prompt 文本(发到 turn/start)">
    <button onclick="startTurn()">turn/start</button>
  </div>
  <div class="row">
    <input id="rawmethod" placeholder="method e.g. thread/turn/start">
    <input id="rawparams" placeholder='params JSON e.g. {"text":"hi"}' value="{}">
    <button onclick="rawRpc()">raw rpc</button>
  </div>
  <pre id="out" class="muted">click a button — output appears here</pre>
  <script>
    const out = document.getElementById('out')
    function user() { return document.getElementById('user').value.trim() }
    async function send(body) {
      out.textContent = '... calling ' + (body.method || '?')
      const r = await fetch('/api/rpc/' + encodeURIComponent(user()), {
        method: 'POST',
        headers: {'content-type': 'application/json'},
        body: JSON.stringify(body),
      })
      const j = await r.json().catch(() => ({error: 'non-json response', status: r.status}))
      out.textContent = JSON.stringify(j, null, 2)
      return j
    }
    function rpc(method, params) {
      return send({ jsonrpc: '2.0', id: 'browser-' + Date.now(), method, params })
    }
    async function listOnline() {
      const r = await fetch('/api/users')
      out.textContent = JSON.stringify(await r.json(), null, 2)
    }
    let lastThreadId = null
    async function startTurn() {
      const text = document.getElementById('msg').value
      if (!lastThreadId) {
        const c = await rpc('thread/start', {})
        lastThreadId = c?.result?.thread?.id
      }
      await rpc('turn/start', {
        threadId: lastThreadId,
        items: [{ type: 'text', text }],
      })
    }
    function rawRpc() {
      const method = document.getElementById('rawmethod').value
      let params = {}
      try { params = JSON.parse(document.getElementById('rawparams').value || '{}') }
      catch (e) { return out.textContent = 'bad params JSON: ' + e.message }
      return rpc(method, params)
    }
  </script>
</body>
</html>
